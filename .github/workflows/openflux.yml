name: OpenFlux Exit Node (Yandex)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  openflux:
    runs-on: ubuntu-24.04
    timeout-minutes: 350

    env:
      TRANSPORT: yandex
      DOC_URL: ${{ secrets.YANDEX_DOC_URL }}

    steps:
      - name: Check secret
        shell: bash
        run: |
          set +x

          if [ -z "${DOC_URL:-}" ]; then
            echo "ERROR: DOC_URL is not configured (transport: ${TRANSPORT})."
            exit 1
          fi

          echo "::add-mask::$DOC_URL"
          echo "DOC_URL: configured"

      - name: Install dependencies
        shell: bash
        run: |
          set +x

          sudo apt-get update
          sudo apt-get install -y git golang-go

      - name: Download OpenFlux
        shell: bash
        run: |
          set +x

          git clone --depth 1 https://github.com/p1neappleXpress/OpenFlux.git
          cd OpenFlux

          echo "OpenFlux commit:"
          git rev-parse --short HEAD

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.4'
          cache: false

      - name: Verify Go
        shell: bash
        run: |
          set +x
          go version

      - name: Build OpenFlux
        shell: bash
        run: |
          set +x

          cd OpenFlux

          go mod tidy
          go build -o universal-bypass-tool .

          chmod +x universal-bypass-tool

          echo "Build successful."

      - name: Start OpenFlux
        shell: bash
        run: |
          set +x

          cd OpenFlux

          echo "======================================"
          echo "Starting OpenFlux"
          echo "Mode: l4 (proxy)"
          echo "Transport: ${TRANSPORT}"
          echo "URL: configured (hidden)"
          echo "Debug: disabled"
          echo "======================================"

          exec sudo ./universal-bypass-tool \
            --role=exit \
            --mode=l4 \
            --codec=legacy \
            --transport "$TRANSPORT" \
            --url "$DOC_URL"